<!DOCTYPE html>
<html lang="ko-KR">
<head>
<meta charset="UTF-8" >
<meta http-equiv="X-UA-Compatible" content="IE=edge" >
<meta name="viewport" 
        content="width=device-width, 
                initial-scale=1.0, 
                minimum-scale=1.0, 
                maximum-scale=5.0, 
                user-scalable=yes" >
<meta name="description" content="설명 입력">
<title>form lab1</title>
</head>
<body>
    <!--action : 제출할곳-->
    <!-- method : 제출할 방식 -->
    <!-- url에서 결과 확인 가능. -->
    <form action="#" method="get"> 
        <div> <!--정렬용 div -->
            <!-- for, id 동일하게 맞춰준다. -->
            <!-- name은 서버 제출용 -->
            <label for="id">아이디</label> 
            <input type="text" id="id" name="id"> <br>
        </div>
        <div>
            <label for="pw">비밀번호</label>
            <input type="password" id="pw" name="pw"> <br>
        </div>
        <div>
            <label for="username">닉네임</label>
            <input type="text" id="username" name="username">
        </div>
        <input type="submit">
    </form>


    <div><input type="text" placeholder="text"></div>
    <div><input type="password" placeholder="password"></div>
    <div><input type="email" placeholder="email"></div>
    <div><input type="tel" placeholder="tel"></div>
    <div><input type="number" placeholder="number"></div>
    <div><input type="url" placeholder="url"></div>
    <div><input type="search" placeholder="search"></div>
    <div><input type="date"></div>
    <div><input type="button" placeholder="로그인하기"></div>
    <div><input type="reset" placeholder="초기화"></div>
    <div><input type="submit" placeholder="회원가입하기"></div>
    <div><input type="checkbox" name="" id=""></div>
    <div><input type="radio" name="" id=""></div>
    <div><input type="color" name="" id=""></div>
    <div><input type="range" name="" id=""></div>
    <div><input type="file" name="" id=""></div>

</body>
</html>
